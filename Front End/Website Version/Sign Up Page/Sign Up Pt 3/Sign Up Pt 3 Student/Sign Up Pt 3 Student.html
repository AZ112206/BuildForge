<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kid-In | Student Sign Up Pt 3</title>
  <link rel="stylesheet" href="Sign Up Pt 3 Student.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flag-icons@7.2.3/css/flag-icons.min.css" />
</head>
<body>
  <div id="gear-toggle-container" class="gear-toggle-container">
    <div class="gear-options">
      <button id="theme-toggle-btn" class="gear-option-btn" aria-label="Toggle Dark/Light Mode">
        <span id="theme-icon"></span>
      </button>
      <button id="transparency-toggle-btn" class="gear-option-btn" aria-label="Toggle Solid/Transparent Mode">
        <span id="transparency-icon"></span>
      </button>
    </div>
    <button class="gear-main-btn" aria-label="Display settings">
      <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
    </button>
  </div>

  <div class="signup-container">
    <div class="signup-header">
      <h1>Student Sign Up</h1>
      <p>Required for students to access and manage their profiles and activities</p>
    </div>

    <form id="student-signup-form" class="signup-form">
      <fieldset class="form-section">
        <legend>Account Security</legend>

        <div class="form-group">
          <label for="student-email">Email Address *</label>
          <input type="email" id="student-email" name="student-email" class="form-input" required placeholder="e.g., student@email.com" autocomplete="email" />
        </div>

        <div class="form-group password-group">
          <label for="student-password">Password *</label>
          <div class="password-field">
            <input type="password" id="student-password" name="student-password" class="form-input password-input" required placeholder="Create a strong password" autocomplete="new-password" />
            <button type="button" class="password-toggle" data-target="student-password" aria-label="Show password">
              <svg class="toggle-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
          <div class="password-meter" aria-live="polite" aria-label="Password strength meter">
            <span class="password-segment" data-strength="1"></span>
            <span class="password-segment" data-strength="2"></span>
            <span class="password-segment" data-strength="3"></span>
            <span class="password-segment" data-strength="4"></span>
            <span class="password-segment" data-strength="5"></span>
          </div>
          <div class="password-strength-row">
            <span class="password-strength-label">Strength</span>
            <span id="student-password-strength-value" class="password-strength-value">–</span>
          </div>
        </div>

        <div class="form-group">
          <label for="student-confirm-password">Repeat Password *</label>
          <div class="password-field">
            <input type="password" id="student-confirm-password" name="student-confirm-password" class="form-input password-input" required placeholder="Confirm your password" autocomplete="new-password" />
            <button type="button" class="password-toggle" data-target="student-confirm-password" aria-label="Show password">
              <svg class="toggle-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
          <small id="student-password-match-error" class="error-text" style="display:none;">Passwords do not match.</small>
        </div>
      </fieldset>

      <div class="form-actions">
        <button type="button" id="back-btn" class="pill-button pill-button-mint">Back</button>
        <button type="submit" id="student-submit-btn" class="pill-button pill-button-indigo" disabled>Next</button>
      </div>
    </form>
  </div>

  <div id="signup-success" class="signup-success" hidden>
    <div class="success-icon" aria-hidden="true">
      <svg xmlns="http://www.w3.org/2000/svg" width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/>
        <polyline points="9 12 11.5 14.5 16 9.5"/>
      </svg>
    </div>
    <h2>You're all set, <span id="success-first-name">friend</span></h2>
    <p>Your <span id="success-role">account</span> has been created. Check your email to verify and get started.</p>
  </div>

  <script src="Sign Up Pt 3 Student.js"></script>
